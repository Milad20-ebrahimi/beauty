name: Apply admin redesign

on:
  push:
    paths:
      - '.github/workflows/apply-admin-redesign.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply update
        run: |
          git config user.name "codex"
          git config user.email "codex@users.noreply.github.com"
          git am 0001-feat-redesign-admin-workspace-experience.patch
          rm 0001-feat-redesign-admin-workspace-experience.patch
          rm .github/workflows/apply-admin-redesign.yml
          git add -A
          git commit -m "chore: remove temporary update files"
          git push origin main
