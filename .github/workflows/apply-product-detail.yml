name: Apply product detail update
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        run: |
          git config user.name "codex"
          git config user.email "codex@openai.com"
          git am product-detail-change.txt
          git rm product-detail-change.txt .github/workflows/apply-product-detail.yml
          git commit -m "chore: remove temporary update files"
          git push origin HEAD:main
